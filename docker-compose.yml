services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - model_cache:/root/.cache
    command: >
      -hf unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ4_XS
      --alias qwen-3.6-35b-a3b
      --host 0.0.0.0
      --port 8080
      --ctx-size 262144
      --n-gpu-layers 999
      --n-cpu-moe 20
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  asr:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    ports:
      - "8000:8000"
    environment:
      - WHISPER__INFERENCE_DEVICE=cuda
      - WHISPER__BEAM_SIZE=5
      - WHISPER__VAD_FILTER=true
      - WHISPER__COMPUTE_TYPE=int8_float16
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: postgres:18.3
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - postgres_data:/var/lib/postgresql

  flyway-admin:
    image: flyway/flyway:12.4
    depends_on:
      - postgres
    volumes:
      - ./db/migrations/admin:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/postgres
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: example
      FLYWAY_CONNECT_RETRIES: 60
    command: migrate

  flyway-agent:
    image: flyway/flyway:12.4
    depends_on:
      postgres:
        condition: service_started
      flyway-admin:
        condition: service_completed_successfully
    volumes:
      - ./db/migrations/agent:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/agent
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: example
      FLYWAY_CONNECT_RETRIES: 60
    command: migrate

volumes:
  postgres_data:
  model_cache:
  hf-hub-cache:
