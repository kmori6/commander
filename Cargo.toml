[package]
name = "commander"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "commander"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.1", features = ["derive"] }
cron = "0.16.0"
dotenvy = "0.15.7"
env_logger = "0.11.10"
futures = "0.3.32"
glob = "0.3.3"
html2text = "0.17.1"
ignore = "0.4.25"
indicatif = "0.18.4"
log = "0.4.29"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["http2", "json", "multipart", "rustls"], default-features = false }
rmcp = { version = "1.7.0", default-features = false, features = ["client", "transport-child-process"] }
rustyline = "18.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
termimad = "0.34.1"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
