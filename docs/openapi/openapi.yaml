openapi: 3.1.0
info:
  title: Commander API
  version: 0.1.0
  description: HTTP API for sessions, messages, tasks, schedules, tools, approvals, events, and models.

tags:
  - name: Health
    description: Server status.
  - name: Events
    description: Task event streams.
  - name: Sessions
    description: Session APIs.
  - name: Messages
    description: Session message APIs.
  - name: Tasks
    description: Task APIs.
  - name: Schedules
    description: Schedule APIs.
  - name: Tools
    description: Tool APIs.
  - name: Approvals
    description: Tool approval APIs.
  - name: Models
    description: Model APIs.

paths:
  /v1/health:
    get:
      tags:
        - Health
      summary: Check health
      operationId: getHealth
      responses:
        "200":
          description: Server status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/events:
    get:
      tags:
        - Events
      summary: Stream events
      operationId: streamEvents
      parameters:
        - $ref: "#/components/parameters/TaskIdQuery"
      responses:
        "200":
          description: Server-sent task events.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                taskStarted:
                  value: |
                    event: task_started
                    id: 11111111-1111-1111-1111-111111111111
                    data: {"id":"11111111-1111-1111-1111-111111111111","task_id":"00000000-0000-0000-0000-000000000000","event_type":"task_started","payload":{},"created_at":"2026-05-13T00:00:00Z"}

  /v1/sessions:
    get:
      tags:
        - Sessions
      summary: List sessions
      operationId: listSessions
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SessionKind"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Sessions
      summary: Create session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "500":
          $ref: "#/components/responses/Error"

  /v1/sessions/{id}:
    get:
      tags:
        - Sessions
      summary: Get session
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Sessions
      summary: Update session
      operationId: updateSession
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
      responses:
        "200":
          description: Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/sessions/{id}/messages:
    get:
      tags:
        - Messages
      summary: List messages
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMessagesResponse"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Messages
      summary: Create message
      operationId: createMessage
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "202":
          description: Message accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMessageResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tasks:
    get:
      tags:
        - Tasks
      summary: List tasks
      operationId: listTasks
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTasksResponse"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Tasks
      summary: Create task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tasks/{id}:
    get:
      tags:
        - Tasks
      summary: Get task
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tasks/{id}/result:
    get:
      tags:
        - Tasks
      summary: Get task result
      operationId: getTaskResult
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Task result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResult"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tasks/{id}/events:
    get:
      tags:
        - Tasks
      summary: List task events
      operationId: listTaskEvents
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Task events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTaskEventsResponse"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tasks/{id}/cancel:
    post:
      tags:
        - Tasks
      summary: Cancel task
      operationId: cancelTask
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tasks/{id}/usage:
    get:
      tags:
        - Tasks
      summary: Get task usage
      operationId: getTaskUsage
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Token usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskUsage"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/schedules:
    get:
      tags:
        - Schedules
      summary: List schedules
      operationId: listSchedules
      responses:
        "200":
          description: Schedules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSchedulesResponse"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Schedules
      summary: Create schedule
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "201":
          description: Schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/schedules/{id}:
    get:
      tags:
        - Schedules
      summary: Get schedule
      operationId: getSchedule
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Schedules
      summary: Update schedule
      operationId: updateSchedule
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleRequest"
      responses:
        "200":
          description: Schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/schedules/{id}/run:
    post:
      tags:
        - Schedules
      summary: Run schedule
      operationId: runSchedule
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "202":
          description: Run accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunScheduleResponse"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/schedules/{id}/runs:
    get:
      tags:
        - Schedules
      summary: List schedule runs
      operationId: listScheduleRuns
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Schedule runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListScheduleRunsResponse"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tools:
    get:
      tags:
        - Tools
      summary: List tools
      operationId: listTools
      responses:
        "200":
          description: Tools.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListToolsResponse"

  /v1/tools/permissions:
    get:
      tags:
        - Tools
      summary: List tool permissions
      operationId: listToolPermissions
      responses:
        "200":
          description: Tool permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListToolPermissionsResponse"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tools/permissions/{tool_name}:
    put:
      tags:
        - Tools
      summary: Update tool permission
      operationId: updateToolPermission
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateToolPermissionRequest"
      responses:
        "200":
          description: Tool permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPermission"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tools/approvals:
    get:
      tags:
        - Approvals
      summary: List approvals
      operationId: listToolApprovals
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ToolApprovalStatus"
      responses:
        "200":
          description: Tool approvals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListToolApprovalsResponse"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tools/approvals/{id}/approve:
    post:
      tags:
        - Approvals
      summary: Approve tool call
      operationId: approveToolApproval
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Tool approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolApproval"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tools/approvals/{id}/reject:
    post:
      tags:
        - Approvals
      summary: Reject tool call
      operationId: rejectToolApproval
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Tool approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolApproval"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/models:
    get:
      tags:
        - Models
      summary: List models
      operationId: listModels
      responses:
        "200":
          description: Models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListModelsResponse"

  /v1/model:
    get:
      tags:
        - Models
      summary: Get current model
      operationId: getModel
      responses:
        "200":
          description: Current model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetModelResponse"
    put:
      tags:
        - Models
      summary: Update current model
      operationId: updateModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModelRequest"
      responses:
        "200":
          description: Selected model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateModelResponse"
        "400":
          description: Invalid model.
          content:
            text/plain:
              schema:
                type: string

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskIdQuery:
      name: task_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 20

  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string

    SessionKind:
      type: string
      enum:
        - chat
        - task

    SessionStatus:
      type: string
      enum:
        - active
        - closed

    Session:
      type: object
      required:
        - id
        - kind
        - title
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/SessionKind"
        title:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/SessionStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSessionRequest:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/SessionKind"
        title:
          type:
            - string
            - "null"

    UpdateSessionRequest:
      type: object
      properties:
        title:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/SessionStatus"

    ListSessionsResponse:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    MessageRole:
      type: string
      enum:
        - system
        - user
        - assistant

    Message:
      type: object
      required:
        - id
        - session_id
        - role
        - content
        - created_at
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MessageRole"
        content:
          type: array
          items:
            $ref: "#/components/schemas/MessageContent"
        created_at:
          type: string
          format: date-time

    MessageContent:
      oneOf:
        - $ref: "#/components/schemas/InputTextContent"
        - $ref: "#/components/schemas/OutputTextContent"
        - $ref: "#/components/schemas/ToolCallContent"
        - $ref: "#/components/schemas/ToolCallOutputContent"
      discriminator:
        propertyName: type

    InputTextContent:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          const: input_text
        text:
          type: string

    OutputTextContent:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          const: output_text
        text:
          type: string

    ToolCallContent:
      type: object
      required:
        - type
        - call_id
        - tool_name
        - arguments
      properties:
        type:
          type: string
          const: tool_call
        call_id:
          type: string
        tool_name:
          type: string
        arguments: {}

    ToolCallOutputContent:
      type: object
      required:
        - type
        - call_id
        - output
        - output_status
      properties:
        type:
          type: string
          const: tool_call_output
        call_id:
          type: string
        output: {}
        output_status:
          type: string
          enum:
            - success
            - error

    CreateMessageRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string

    CreateMessageResponse:
      type: object
      required:
        - message
        - task_id
      properties:
        message:
          $ref: "#/components/schemas/Message"
        task_id:
          type: string
          format: uuid

    ListMessagesResponse:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    TaskStatus:
      type: string
      enum:
        - queued
        - running
        - awaiting_approval
        - completed
        - failed
        - cancel_requested
        - cancelled

    Task:
      type: object
      required:
        - id
        - request
        - status
        - session_id
        - source_message_id
        - parent_task_id
        - created_at
        - updated_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        request:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        session_id:
          type: string
          format: uuid
        source_message_id:
          type:
            - string
            - "null"
          format: uuid
        parent_task_id:
          type:
            - string
            - "null"
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time

    CreateTaskRequest:
      type: object
      required:
        - request
      properties:
        request:
          type: string
        parent_task_id:
          type:
            - string
            - "null"
          format: uuid

    ListTasksResponse:
      type: object
      required:
        - tasks
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"

    TaskResultStatus:
      type: string
      enum:
        - success
        - failure
        - cancelled

    TaskResult:
      type: object
      required:
        - id
        - task_id
        - status
        - output
        - created_at
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TaskResultStatus"
        output:
          type: string
        created_at:
          type: string
          format: date-time

    TaskEvent:
      type: object
      required:
        - id
        - task_id
        - event_type
        - payload
        - created_at
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        event_type:
          type: string
        payload: {}
        created_at:
          type: string
          format: date-time

    ListTaskEventsResponse:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/TaskEvent"

    TaskUsage:
      type: object
      required:
        - task_id
        - input_tokens
        - output_tokens
        - cache_read_tokens
        - cache_write_tokens
        - total_tokens
      properties:
        task_id:
          type: string
          format: uuid
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        cache_read_tokens:
          type: integer
          format: int64
        cache_write_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64

    Schedule:
      type: object
      required:
        - id
        - title
        - request
        - cron
        - timezone
        - enabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        request:
          type: string
        cron:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateScheduleRequest:
      type: object
      required:
        - title
        - request
        - cron
      properties:
        title:
          type: string
        request:
          type: string
        cron:
          type: string
        timezone:
          type:
            - string
            - "null"
          default: UTC
        enabled:
          type:
            - boolean
            - "null"
          default: true

    UpdateScheduleRequest:
      type: object
      properties:
        title:
          type:
            - string
            - "null"
        request:
          type:
            - string
            - "null"
        cron:
          type:
            - string
            - "null"
        timezone:
          type:
            - string
            - "null"
        enabled:
          type:
            - boolean
            - "null"

    ListSchedulesResponse:
      type: object
      required:
        - schedules
      properties:
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"

    ScheduleRun:
      type: object
      required:
        - id
        - schedule_id
        - task_id
        - scheduled_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        schedule_id:
          type: string
