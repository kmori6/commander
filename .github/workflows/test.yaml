name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: example
          POSTGRES_DB: commander_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commander_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:example@localhost:5432/commander_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run database migrations
        run: |
          for file in $(find db/migrations/agent -maxdepth 1 -name 'V*.sql' | sort -V); do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Run tests
        run: cargo test --all-targets --all-features
